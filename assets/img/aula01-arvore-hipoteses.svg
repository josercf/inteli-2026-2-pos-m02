  <text x="32" y="326" font-size="17" font-weight="600" fill="#2e2640">em poucas contas</text>
  <rect x="32" y="340" width="4" height="22" fill="#066d73"/>
  <text x="46" y="357" font-size="15" fill="#066d73">receita_brl, segmento</text>
  <path d="M 579 230 L 579 256 L 437 256 L 437 278" fill="none"
