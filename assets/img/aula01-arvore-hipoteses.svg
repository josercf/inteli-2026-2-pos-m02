  <text x="814" y="184" font-size="21" font-weight="600" fill="#2e2640">Mais perda bruta</text>
  <text x="814" y="208" font-size="16" fill="#2e2640">contas que</text>
  <text x="814" y="226" font-size="16" fill="#2e2640">encerraram contrato</text>
  <path d="M 579 230 L 579 256 L 147 256 L 147 278" fill="none"
