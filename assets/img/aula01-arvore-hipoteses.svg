  <text x="428" y="184" font-size="21" font-weight="600" fill="#2e2640">Mais contração</text>
  <text x="428" y="208" font-size="16" fill="#2e2640">contas que ficaram</text>
  <text x="428" y="226" font-size="16" fill="#2e2640">compraram menos</text>
  <path d="M 584 110 L 584 134 L 965 134 L 965 156" fill="none"
