  <text x="322" y="304" font-size="17" font-weight="600" fill="#2e2640">A cadência de pedidos cai</text>
  <text x="322" y="326" font-size="17" font-weight="600" fill="#2e2640">antes da receita</text>
  <rect x="322" y="340" width="4" height="22" fill="#066d73"/>
  <text x="336" y="357" font-size="15" fill="#066d73">pedidos, recencia_dias</text>
  <path d="M 579 230 L 579 256 L 727 256 L 727 278" fill="none"
