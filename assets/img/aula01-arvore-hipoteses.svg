  <text x="42" y="184" font-size="21" font-weight="600" fill="#2e2640">Menos expansão</text>
  <text x="42" y="208" font-size="16" fill="#2e2640">contas que cresciam</text>
  <text x="42" y="226" font-size="16" fill="#2e2640">cresceram menos</text>
  <path d="M 584 110 L 584 134 L 579 134 L 579 156" fill="none"
