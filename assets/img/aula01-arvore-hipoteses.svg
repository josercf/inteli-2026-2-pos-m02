  <rect x="612" y="340" width="4" height="22" fill="#066d73"/>
  <text x="626" y="357" font-size="15" fill="#066d73">linhas_produto_ativas</text>
  <path d="M 579 230 L 579 256 L 1017 256 L 1017 278" fill="none"
