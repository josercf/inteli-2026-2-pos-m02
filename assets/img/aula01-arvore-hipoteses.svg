<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1168 350" width="1168" height="350"
     font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" role="img"
     aria-label="Árvore de hipóteses decompondo a queda do NRR em três componentes mutuamente exclusivos e quatro hipóteses testáveis">
  <rect width="1168" height="350" fill="#ffffff"/>
  <rect x="380" y="8" width="408" height="98" rx="8" fill="#2e2640"/>
  <text x="406" y="42" font-size="21" font-weight="700" fill="#ffffff">Por que o NRR caiu de</text>
  <text x="406" y="70" font-size="21" font-weight="700" fill="#ffffff">109% para 93%?</text>
  <text x="406" y="93" font-size="15" fill="#e6eaeb">a pergunta do Comitê de 3 de março</text>
  
  <path d="M 584 110 L 584 134 L 193 134 L 193 156" fill="none"
